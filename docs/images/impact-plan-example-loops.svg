<svg xmlns="http://www.w3.org/2000/svg" width="760" height="398" viewBox="0 0 760 398" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif">
<title id="t">Feedback loops</title><desc id="d">Loop map. R1 reinforcing &quot;Cost grows with traffic&quot;: More visits → A new image generated for every visit → More GPU spend, energy and slower pages → Pressure to drive more traffic to recoup it; B1 balancing &quot;Visible, capped spend&quot;: Generation spend on the team dashboard → Monthly budget reached → Serve cached variants instead → Spend falls back under the cap; B1 limits R1.</desc>
<style>
  .surface{fill:#ffffff} .ink{fill:#191919} .ink2{fill:#666666} .rule{stroke:#e7e7e7}
  .axis{stroke:#c2c2c2} .hit{fill:#eaf2fd} .mark{fill:#2370cd} .marktext{fill:#ffffff}
  .r-low{fill:#84b9f3} .r-medium{fill:#257de0} .r-high{fill:#0f4a96} .r-na{fill:#f1f1f1}
  .t-low{fill:#0b0b0b} .t-medium{fill:#ffffff} .t-high{fill:#ffffff} .t-na{fill:#666666}
  .lp-b{stroke:#257de0} .lp-r{stroke:#f47230} .lf-b{fill:#257de0} .lf-r{fill:#f47230} .lt-b{fill:#ffffff} .lt-r{fill:#0b0b0b}
  .box{fill:#f6f6f6} .tag{fill:#eaf2fd}
  .lowconf{fill:none;stroke-width:2;stroke-dasharray:6 5} .lc-low{stroke:#0b0b0b} .lc-medium,.lc-high{stroke:#ffffff} .lc-key{stroke:#666666}
  @media (prefers-color-scheme: dark){
    .surface{fill:#191919} .ink{fill:#efefef} .ink2{fill:#9c9c9c} .rule{stroke:#303030}
    .axis{stroke:#474747} .hit{fill:#1c2a3d} .mark{fill:#519ced} .marktext{fill:#0b0b0b}
    .r-low{fill:#1757ac} .r-medium{fill:#338ced} .r-high{fill:#9dc8f7} .r-na{fill:#262626}
    .t-low{fill:#ffffff} .t-medium{fill:#0b0b0b} .t-high{fill:#0b0b0b} .t-na{fill:#9c9c9c}
    .lp-b{stroke:#338ced} .lp-r{stroke:#e76624} .lf-b{fill:#338ced} .lf-r{fill:#e76624} .lt-b{fill:#0b0b0b} .lt-r{fill:#0b0b0b}
    .box{fill:#232323} .tag{fill:#1c2a3d}
    .lc-low{stroke:#ffffff} .lc-medium,.lc-high{stroke:#0b0b0b} .lc-key{stroke:#9c9c9c}
  }
</style>
<rect class="surface" width="760" height="398" rx="12"/>
<text class="ink" x="24" y="34" font-size="20" font-weight="600">How the system behaves</text>
<text class="ink2" x="24" y="56" font-size="13">Feedback loops this design creates (R, reinforcing) and the ones that hold them in check (B, balancing).</text>
<rect class="lf-r" x="24" y="84" width="34" height="24" rx="6"/><text class="lt-r" x="41" y="101" font-size="13" font-weight="700" text-anchor="middle">R1</text>
<text class="ink" x="68" y="101" font-size="15" font-weight="600">Cost grows with traffic<tspan class="ink2" font-weight="400" font-size="13">  ·  Reinforcing</tspan></text>
<rect class="box lp-r" x="24.0" y="122" width="151.5" height="71" rx="10" stroke-width="2"/>
<text class="ink" x="99.8" y="162.5" font-size="13" text-anchor="middle">More visits</text>
<path class="lp-r" d="M178.5 157.5 H192.5" stroke-width="2" fill="none"/><path class="lf-r" d="M191.5 152.5 L197.5 157.5 L191.5 162.5 Z"/>
<rect class="box lp-r" x="197.5" y="122" width="151.5" height="71" rx="10" stroke-width="2"/>
<text class="ink" x="273.2" y="145.5" font-size="13" text-anchor="middle">A new image</text>
<text class="ink" x="273.2" y="162.5" font-size="13" text-anchor="middle">generated for</text>
<text class="ink" x="273.2" y="179.5" font-size="13" text-anchor="middle">every visit</text>
<path class="lp-r" d="M352.0 157.5 H366.0" stroke-width="2" fill="none"/><path class="lf-r" d="M365.0 152.5 L371.0 157.5 L365.0 162.5 Z"/>
<rect class="box lp-r" x="371.0" y="122" width="151.5" height="71" rx="10" stroke-width="2"/>
<text class="ink" x="446.8" y="145.5" font-size="13" text-anchor="middle">More GPU spend,</text>
<text class="ink" x="446.8" y="162.5" font-size="13" text-anchor="middle">energy and slower</text>
<text class="ink" x="446.8" y="179.5" font-size="13" text-anchor="middle">pages</text>
<path class="lp-r" d="M525.5 157.5 H539.5" stroke-width="2" fill="none"/><path class="lf-r" d="M538.5 152.5 L544.5 157.5 L538.5 162.5 Z"/>
<rect class="box lp-r" x="544.5" y="122" width="151.5" height="71" rx="10" stroke-width="2"/>
<text class="ink" x="620.2" y="145.5" font-size="13" text-anchor="middle">Pressure to drive</text>
<text class="ink" x="620.2" y="162.5" font-size="13" text-anchor="middle">more traffic to</text>
<text class="ink" x="620.2" y="179.5" font-size="13" text-anchor="middle">recoup it</text>
<path class="lp-r" d="M620.2 193 V207 Q620.2 215 612.2 215 H107.8 Q99.8 215 99.8 207 V202" stroke-width="2" fill="none"/><path class="lf-r" d="M94.8 203 L99.8 196 L104.8 203 Z"/>
<text class="ink2" x="360.0" y="209" font-size="12" text-anchor="middle">and round again, faster</text>
<rect class="lf-b" x="24" y="245" width="34" height="24" rx="6"/><text class="lt-b" x="41" y="262" font-size="13" font-weight="700" text-anchor="middle">B1</text>
<text class="ink" x="68" y="262" font-size="15" font-weight="600">Visible, capped spend<tspan class="ink2" font-weight="400" font-size="13">  ·  Balancing</tspan></text>
<rect class="tag" x="568" y="245" width="128" height="24" rx="12"/><circle class="mark" cx="582" cy="257" r="9"/><text class="marktext" x="582" y="261" font-size="11" font-weight="700" text-anchor="middle">3</text><text class="ink" x="598" y="261" font-size="12">from trimtab</text>
<rect class="box lp-b" x="24.0" y="283" width="151.5" height="71" rx="10" stroke-width="2"/>
<text class="ink" x="99.8" y="306.5" font-size="13" text-anchor="middle">Generation spend</text>
<text class="ink" x="99.8" y="323.5" font-size="13" text-anchor="middle">on the team</text>
<text class="ink" x="99.8" y="340.5" font-size="13" text-anchor="middle">dashboard</text>
<path class="lp-b" d="M178.5 318.5 H192.5" stroke-width="2" fill="none"/><path class="lf-b" d="M191.5 313.5 L197.5 318.5 L191.5 323.5 Z"/>
<rect class="box lp-b" x="197.5" y="283" width="151.5" height="71" rx="10" stroke-width="2"/>
<text class="ink" x="273.2" y="315.0" font-size="13" text-anchor="middle">Monthly budget</text>
<text class="ink" x="273.2" y="332.0" font-size="13" text-anchor="middle">reached</text>
<path class="lp-b" d="M352.0 318.5 H366.0" stroke-width="2" fill="none"/><path class="lf-b" d="M365.0 313.5 L371.0 318.5 L365.0 323.5 Z"/>
<rect class="box lp-b" x="371.0" y="283" width="151.5" height="71" rx="10" stroke-width="2"/>
<text class="ink" x="446.8" y="315.0" font-size="13" text-anchor="middle">Serve cached</text>
<text class="ink" x="446.8" y="332.0" font-size="13" text-anchor="middle">variants instead</text>
<path class="lp-b" d="M525.5 318.5 H539.5" stroke-width="2" fill="none"/><path class="lf-b" d="M538.5 313.5 L544.5 318.5 L538.5 323.5 Z"/>
<rect class="box lp-b" x="544.5" y="283" width="151.5" height="71" rx="10" stroke-width="2"/>
<text class="ink" x="620.2" y="315.0" font-size="13" text-anchor="middle">Spend falls back</text>
<text class="ink" x="620.2" y="332.0" font-size="13" text-anchor="middle">under the cap</text>
<path class="lp-b" d="M620.2 354 V368 Q620.2 376 612.2 376 H107.8 Q99.8 376 99.8 368 V363" stroke-width="2" fill="none"/><path class="lf-b" d="M94.8 364 L99.8 357 L104.8 364 Z"/>
<text class="ink2" x="360.0" y="370" font-size="12" text-anchor="middle">and back toward the limit</text>
<path class="lp-b" d="M700 318.5 H726 V157.5 H706" stroke-width="2" fill="none" stroke-dasharray="5 4"/><path class="lf-b" d="M708 152.5 L701 157.5 L708 162.5 Z"/>
<text class="ink2" font-size="12" transform="translate(740 238.0) rotate(-90)" text-anchor="middle">limits R1</text></svg>
